<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="el-pr-ch01-s01-p012: Belljaw is right, Mira center-left, Elian behind, intact anchor below-left, and the sealed lift beyond the boss."><title>el-pr-ch01-s01-p012: Belljaw is right, Mira center-left, Elian behind, intact anchor below-left, and the sealed lift beyond the boss.</title><path d="M61.7,61.4 C41.0,94.6 41.0,288.2 57.3,337.9 C170.0,343.3 400.7,337.9 409.6,268.8 C413.2,116.7 394.8,61.4 61.7,61.4Z" fill="#f6f0e4" fill-opacity=".94" stroke="#11151b" stroke-width="3"/><path d="M360.6,337.9 Q512.0,844.8 393.3,335.0Z" fill="#f6f0e4" fill-opacity=".92" stroke="#11151b" stroke-width="3" stroke-linejoin="round"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="29.7" font-weight="720" fill="#12151a"><tspan x="225.3" y="166.4">If it reaches</tspan><tspan x="225.3" y="199.7">center, the bridge</tspan><tspan x="225.3" y="232.9">rolls.</tspan></text><path d="M655.7,1167.4 C638.4,1200.5 631.3,1394.1 651.2,1443.8 C756.7,1449.2 974.1,1440.3 983.0,1374.7 C986.6,1222.7 968.2,1170.9 655.7,1167.4Z" fill="#f6f0e4" fill-opacity=".94" stroke="#11151b" stroke-width="3"/><path d="M645.3,1167.4 Q512.0,691.2 677.9,1164.4Z" fill="#f6f0e4" fill-opacity=".92" stroke="#11151b" stroke-width="3" stroke-linejoin="round"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="29.7" font-weight="720" fill="#12151a"><tspan x="809.0" y="1272.3">Then I turn the</tspan><tspan x="809.0" y="1305.6">head. You read</tspan><tspan x="809.0" y="1338.9">the legs.</tspan></text></svg>
