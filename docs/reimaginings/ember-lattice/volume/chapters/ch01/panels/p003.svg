<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="el-ch01-s01-p003: Elian and Mira trade a dry warning; the failing bridge anchor remains visible between their adult faces.">
  <title>el-ch01-s01-p003: Elian and Mira trade a dry warning; the failing bridge anchor remains visible between their adult faces.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/pilot/source/p003.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 336.1 432.7 L 430.1 553.0 L 365.1 434.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="41.0" y="61.4" width="348.2" height="391.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="215.0" y="110.8">That anchor is</tspan><tspan x="215.0" y="150.5">singing. Tell</tspan><tspan x="215.0" y="190.2">me you still</tspan><tspan x="215.0" y="229.9">have both Iron</tspan><tspan x="215.0" y="269.6">Seals before</tspan><tspan x="215.0" y="309.3">the bridge</tspan><tspan x="215.0" y="349.0">decides to</tspan><tspan x="215.0" y="388.7">become a</tspan><tspan x="215.0" y="428.4">ladder.</tspan></text><path d="M 657.9 1103.3 L 593.9 1013.8 L 686.9 1101.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="634.9" y="1083.3" width="348.2" height="391.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="809.0" y="1132.6">Both seals.</tspan><tspan x="809.0" y="1172.3">One bad rib.</tspan><tspan x="809.0" y="1212.0">And a</tspan><tspan x="809.0" y="1251.7">professional</tspan><tspan x="809.0" y="1291.4">opinion that</tspan><tspan x="809.0" y="1331.1">we should stop</tspan><tspan x="809.0" y="1370.8">standing on</tspan><tspan x="809.0" y="1410.5">the thing that</tspan><tspan x="809.0" y="1450.2">is singing.</tspan></text>
</svg>
