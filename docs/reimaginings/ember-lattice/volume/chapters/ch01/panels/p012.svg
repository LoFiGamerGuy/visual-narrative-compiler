<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch01-s01-p012: Elian hangs alone from the chain, guarding his cracked left rib as the collarbone ember fissure closes.">
  <title>el-ch01-s01-p012: Elian hangs alone from the chain, guarding his cracked left rib as the collarbone ember fissure closes.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/pilot/source/p012.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 491.7 L 362.9 655.6 L 304.3 493.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="438.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="152.1">Stop turning</tspan><tspan x="181.4" y="185.6">injuries into</tspan><tspan x="181.4" y="219.1">field notes.</tspan><tspan x="181.4" y="252.6">Your breath</tspan><tspan x="181.4" y="286.1">is folding at</tspan><tspan x="181.4" y="319.6">the</tspan><tspan x="181.4" y="353.1">collarbone,</tspan><tspan x="181.4" y="386.6">and I cannot</tspan><tspan x="181.4" y="420.1">shield you</tspan><tspan x="181.4" y="453.6">from inside.</tspan></text><path d="M 558.7 1365.7 L 501.1 1201.9 L 587.7 1363.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><path d="M 555.7 1345.7 L 811.4 1350.7 L 829.4 1373.7 L 823.4 1730.2 L 799.4 1748.2 L 551.7 1743.2 L 535.7 1718.2 L 541.7 1363.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1390.0">You can</tspan><tspan x="682.6" y="1423.5">shield the</tspan><tspan x="682.6" y="1457.0">bridge. I</tspan><tspan x="682.6" y="1490.5">need one</tspan><tspan x="682.6" y="1524.0">complete</tspan><tspan x="682.6" y="1557.5">pattern and</tspan><tspan x="682.6" y="1591.0">something hot</tspan><tspan x="682.6" y="1624.5">enough to</tspan><tspan x="682.6" y="1658.0">force the</tspan><tspan x="682.6" y="1691.5">second</tspan><tspan x="682.6" y="1725.0">circuit.</tspan></text>
</svg>
