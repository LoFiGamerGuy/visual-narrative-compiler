<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch01-s01-p017: Mira kneels to bind Elian&#x27;s ribs while he tries and fails to stand without her help.">
  <title>el-ch01-s01-p017: Mira kneels to bind Elian&#x27;s ribs while he tries and fails to stand without her help.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch01/source/p017.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 435.2 L 362.9 655.6 L 304.3 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="123.9">The rib is</tspan><tspan x="181.4" y="157.4">not a</tspan><tspan x="181.4" y="190.8">metaphor. You</tspan><tspan x="181.4" y="224.3">cannot</tspan><tspan x="181.4" y="257.8">breathe</tspan><tspan x="181.4" y="291.3">around it</tspan><tspan x="181.4" y="324.8">forever just</tspan><tspan x="181.4" y="358.3">because the</tspan><tspan x="181.4" y="391.8">Ledger has</tspan><tspan x="181.4" y="425.3">not objected yet.</tspan></text><path d="M 558.7 1385.8 L 501.1 1201.9 L 587.7 1383.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1365.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1433.5">I was hoping</tspan><tspan x="682.6" y="1467.0">the dignified</tspan><tspan x="682.6" y="1500.5">silence would</tspan><tspan x="682.6" y="1534.0">imply</tspan><tspan x="682.6" y="1567.5">recovery.</tspan><tspan x="682.6" y="1601.0">Apparently it</tspan><tspan x="682.6" y="1634.5">only implies</tspan><tspan x="682.6" y="1668.0">poor medical</tspan><tspan x="682.6" y="1701.5">judgment.</tspan></text>
</svg>
