  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch01/source/p020.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 491.7 L 362.9 655.6 L 304.3 493.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="438.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="135.3">Do not choose</tspan><tspan x="181.4" y="168.8">the dangerous</tspan><tspan x="181.4" y="202.3">class because</tspan><tspan x="181.4" y="235.8">pain made the</tspan><tspan x="181.4" y="269.3">safer one</tspan><tspan x="181.4" y="302.8">feel</tspan><tspan x="181.4" y="336.3">cowardly.</tspan><tspan x="181.4" y="369.8">Choose it</tspan><tspan x="181.4" y="403.3">only if it</tspan><tspan x="181.4" y="436.8">changes the</tspan><tspan x="181.4" y="470.3">next fight.</tspan></text><path d="M 558.7 1329.3 L 501.1 1201.9 L 587.7 1327.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1309.3" width="293.8" height="438.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1388.5">The Appraiser</tspan><tspan x="682.6" y="1422.0">would tell us</tspan><tspan x="682.6" y="1455.5">what the</tspan><tspan x="682.6" y="1489.0">ruins are</tspan><tspan x="682.6" y="1522.5">worth. The</tspan><tspan x="682.6" y="1556.0">Adept might</tspan><tspan x="682.6" y="1589.5">tell us where</tspan><tspan x="682.6" y="1623.0">the ruins</tspan><tspan x="682.6" y="1656.5">intend to</tspan><tspan x="682.6" y="1690.0">kill us.</tspan></text>
