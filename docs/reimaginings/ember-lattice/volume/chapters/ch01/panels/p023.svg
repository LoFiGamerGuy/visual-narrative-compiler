<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 1672" role="img" aria-label="el-ch01-s01-p023: Elian and Mira step into the rising bell lift together, damaged gear and adult silhouettes clean against the pale door.">
  <title>el-ch01-s01-p023: Elian and Mira step into the rising bell lift together, damaged gear and adult silhouettes clean against the pale door.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch01/source/p023.png" x="0" y="0" width="941" height="1672" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 304.6 346.2 L 395.2 601.9 L 333.6 348.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="37.6" y="66.9" width="319.9" height="299.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="197.6" y="136.8">You know the</tspan><tspan x="197.6" y="173.3">lift may</tspan><tspan x="197.6" y="209.8">refuse a</tspan><tspan x="197.6" y="246.2">classless</tspan><tspan x="197.6" y="282.7">Salvager at</tspan><tspan x="197.6" y="319.2">the next gate.</tspan></text><path d="M 606.4 1274.0 L 545.8 1103.5 L 635.4 1272.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="583.4" y="1254.0" width="319.9" height="351.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="743.4" y="1313.4">Then choose</tspan><tspan x="743.4" y="1349.8">after you can</tspan><tspan x="743.4" y="1386.3">see the price</tspan><tspan x="743.4" y="1422.8">clearly. For</tspan><tspan x="743.4" y="1459.3">once, let</tspan><tspan x="743.4" y="1495.8">tomorrow make</tspan><tspan x="743.4" y="1532.2">its own bad</tspan><tspan x="743.4" y="1568.7">decision.</tspan></text>
</svg>
