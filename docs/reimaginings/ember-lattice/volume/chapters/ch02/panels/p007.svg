<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="el-ch02-s01-p007: A trapped adult delver calls from a dangling maintenance cage while a rescue quest opens.">
  <title>el-ch02-s01-p007: A trapped adult delver calls from a dangling maintenance cage while a rescue quest opens.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch02/source/p007.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 606.7 432.7 L 593.9 553.0 L 635.7 434.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><path d="M 605.7 61.4 H 969.0 Q 983.0 61.4 983.0 75.4 V 430.7 L 961.0 452.7 H 597.7 Q 583.7 452.7 583.7 438.7 V 83.4 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="783.4" y="110.8">Do not cut the</tspan><tspan x="783.4" y="150.5">cage free. The</tspan><tspan x="783.4" y="190.2">little white</tspan><tspan x="783.4" y="229.9">bastards chewed</tspan><tspan x="783.4" y="269.6">the brake pins</tspan><tspan x="783.4" y="309.3">first, and the</tspan><tspan x="783.4" y="349.0">lower chain is</tspan><tspan x="783.4" y="388.7">carrying</tspan><tspan x="783.4" y="428.4">everything.</tspan></text><path d="M 336.1 1143.0 L 430.1 1013.8 L 365.1 1141.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="41.0" y="1123.0" width="348.2" height="351.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="215.0" y="1172.3">We heard you.</tspan><tspan x="215.0" y="1212.0">Keep both</tspan><tspan x="215.0" y="1251.7">hands inside</tspan><tspan x="215.0" y="1291.4">and give us</tspan><tspan x="215.0" y="1331.1">your name</tspan><tspan x="215.0" y="1370.8">after gravity</tspan><tspan x="215.0" y="1410.5">loses</tspan><tspan x="215.0" y="1450.2">interest.</tspan></text>
</svg>
