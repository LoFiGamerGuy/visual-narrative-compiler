<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 887 1774" role="img" aria-label="el-ch02-s01-p009: Wide geography fixes the cage below, Mira on the central beam, Elian above, and the mites moving toward the final pin.">
  <title>el-ch02-s01-p009: Wide geography fixes the cage below, Mira on the central beam, Elian above, and the mites moving toward the final pin.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch02/source/p009.png" x="0" y="0" width="887" height="1774" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 328.4 423.5 L 372.5 638.6 L 357.4 425.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><path d="M 57.5 71.0 H 367.4 Q 381.4 71.0 381.4 85.0 V 421.5 L 359.4 443.5 H 49.5 Q 35.5 443.5 35.5 429.5 V 93.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.8" font-weight="700" fill="#15181d"><tspan x="208.4" y="147.7">Three mites,</tspan><tspan x="208.4" y="182.1">four pins, one</tspan><tspan x="208.4" y="216.5">live chain.</tspan><tspan x="208.4" y="250.9">Mira, if I move</tspan><tspan x="208.4" y="285.3">the cage, can</tspan><tspan x="208.4" y="319.6">you own the</tspan><tspan x="208.4" y="354.0">weight for five</tspan><tspan x="208.4" y="388.4">seconds?</tspan></text><path d="M 572.9 1405.5 L 514.5 1170.8 L 601.9 1403.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="549.9" y="1385.5" width="301.6" height="317.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.8" font-weight="700" fill="#15181d"><tspan x="700.7" y="1434.7">I can own it</tspan><tspan x="700.7" y="1469.1">for eight.</tspan><tspan x="700.7" y="1503.5">Use six and</tspan><tspan x="700.7" y="1537.9">leave me two</tspan><tspan x="700.7" y="1572.3">for</tspan><tspan x="700.7" y="1606.7">regretting</tspan><tspan x="700.7" y="1641.1">the</tspan><tspan x="700.7" y="1675.5">arithmetic.</tspan></text>
</svg>
