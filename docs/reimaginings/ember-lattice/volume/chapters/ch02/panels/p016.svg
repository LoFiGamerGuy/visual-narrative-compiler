  <path d="M 284.1 478.5 L 372.5 638.6 L 313.1 480.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="35.5" y="71.0" width="301.6" height="427.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.8" font-weight="700" fill="#15181d"><tspan x="186.3" y="140.8">The seal is</tspan><tspan x="186.3" y="175.2">our last</tspan><tspan x="186.3" y="209.6">clean bridge</tspan><tspan x="186.3" y="244.0">repair after</tspan><tspan x="186.3" y="278.4">this. Spend</tspan><tspan x="186.3" y="312.7">it only if</tspan><tspan x="186.3" y="347.1">you accept</tspan><tspan x="186.3" y="381.5">what cannot</tspan><tspan x="186.3" y="415.9">be repaired</tspan><tspan x="186.3" y="450.3">later.</tspan></text><path d="M 572.9 1350.5 L 514.5 1170.8 L 601.9 1348.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="549.9" y="1330.5" width="301.6" height="372.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.8" font-weight="700" fill="#15181d"><tspan x="700.7" y="1390.0">A future</tspan><tspan x="700.7" y="1424.4">bridge is</tspan><tspan x="700.7" y="1458.8">hypothetical.</tspan><tspan x="700.7" y="1493.2">The adult</tspan><tspan x="700.7" y="1527.6">hanging from</tspan><tspan x="700.7" y="1562.0">this one has</tspan><tspan x="700.7" y="1596.4">already</tspan><tspan x="700.7" y="1630.8">introduced</tspan><tspan x="700.7" y="1665.1">himself.</tspan></text><path d="M 523.6 71.0 H 851.5 V 448.6 L 833.5 466.6 H 505.6 V 89.0 Z" fill="#10151a" fill-opacity=".82" stroke="#c89952" stroke-width="3"/><path d="M 523.6 85.0 H 833.5" stroke="#f4eee4" stroke-opacity=".28" stroke-width="2"/><text font-family="Arial, sans-serif" letter-spacing=".7"><tspan x="527.6" y="119.1" font-size="31.6" font-weigh