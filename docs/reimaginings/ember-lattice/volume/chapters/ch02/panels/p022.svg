  <path d="M 336.1 551.8 L 430.1 553.0 L 365.1 553.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="41.0" y="61.4" width="348.2" height="510.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="215.0" y="110.8">Ash Crown</tspan><tspan x="215.0" y="150.5">opened a</tspan><tspan x="215.0" y="190.2">private line</tspan><tspan x="215.0" y="229.9">through</tspan><tspan x="215.0" y="269.6">Verdigris.</tspan><tspan x="215.0" y="309.3">They call it a</tspan><tspan x="215.0" y="349.0">shortcut</tspan><tspan x="215.0" y="388.7">because</tspan><tspan x="215.0" y="428.4">&#x27;planned</tspan><tspan x="215.0" y="468.1">structural</tspan><tspan x="215.0" y="507.8">betrayal&#x27;</tspan><tspan x="215.0" y="547.5">lacks charm.</tspan></text><path d="M 657.9 1143.0 L 593.9 1013.8 L 686.9 1141.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="634.9" y="1123.0" width="348.2" height="351.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="809.0" y="1172.3">Which means</tspan><tspan x="809.0" y="1212.0">the Regent</tspan><tspan x="809.0" y="1251.7">waking early</tspan><tspan x="809.0" y="1291.4">is not an</tspan><tspan x="809.0" y="1331.1">accident. It</tspan><tspan x="809.0" y="1370.8">is somebody&#x27;s</tspan><tspan x="809.0" y="1410.5">extraction</tspan><tspan x="809.0" y="1450.2">schedule.</tspan></text>
