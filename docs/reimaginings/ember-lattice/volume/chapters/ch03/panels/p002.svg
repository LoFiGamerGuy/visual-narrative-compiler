<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 862 1825" role="img" aria-label="el-ch03-s01-p002: Orin Pell, a broad light-complexioned adult forge-medic, scans Elian&#x27;s cracked rib through a brass-rimmed monocle.">
  <title>el-ch03-s01-p002: Orin Pell, a broad light-complexioned adult forge-medic, scans Elian&#x27;s cracked rib through a brass-rimmed monocle.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch03/source/p002.png" x="0" y="0" width="862" height="1825" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 557.4 492.8 L 500.0 657.0 L 586.4 494.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="534.4" y="73.0" width="293.1" height="439.8" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="30.9" font-weight="700" fill="#15181d"><tspan x="681.0" y="153.0">Cracked rib,</tspan><tspan x="681.0" y="186.5">improvised</tspan><tspan x="681.0" y="219.9">binding, and</tspan><tspan x="681.0" y="253.3">enough heat</tspan><tspan x="681.0" y="286.7">damage to</tspan><tspan x="681.0" y="320.1">season a pan.</tspan><tspan x="681.0" y="353.6">Which of you</tspan><tspan x="681.0" y="387.0">called this a</tspan><tspan x="681.0" y="420.4">successful</tspan><tspan x="681.0" y="453.8">descent?</tspan></text><path d="M 274.6 1445.3 L 362.0 1204.5 L 303.6 1443.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.5" y="1425.3" width="293.1" height="326.7" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="30.9" font-weight="700" fill="#15181d"><tspan x="181.0" y="1498.9">He did. I</tspan><tspan x="181.0" y="1532.3">called it the</tspan><tspan x="181.0" y="1565.8">minimum</tspan><tspan x="181.0" y="1599.2">evidence</tspan><tspan x="181.0" y="1632.6">required to</tspan><tspan x="181.0" y="1666.0">keep yelling</tspan><tspan x="181.0" y="1699.4">at him.</tspan></text>
</svg>
