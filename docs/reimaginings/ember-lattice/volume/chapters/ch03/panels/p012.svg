<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="el-ch03-s01-p012: Wide geometry fixes the Skitter ahead, Mira at the brass rail, Elian left, and Orin behind cover.">
  <title>el-ch03-s01-p012: Wide geometry fixes the Skitter ahead, Mira at the brass rail, Elian left, and Orin behind cover.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch03/source/p012.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 336.1 393.0 L 430.1 553.0 L 365.1 395.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="41.0" y="61.4" width="348.2" height="351.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="215.0" y="110.8">It pulses in</tspan><tspan x="215.0" y="150.5">threes. Orin,</tspan><tspan x="215.0" y="190.2">stay behind</tspan><tspan x="215.0" y="229.9">the brass</tspan><tspan x="215.0" y="269.6">rail. Mira,</tspan><tspan x="215.0" y="309.3">give the first</tspan><tspan x="215.0" y="349.0">note somewhere</tspan><tspan x="215.0" y="388.7">empty to go.</tspan></text><path d="M 657.9 1219.6 L 593.9 1013.8 L 686.9 1217.6 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="634.9" y="1199.6" width="348.2" height="274.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="809.0" y="1250.3">You get one</tspan><tspan x="809.0" y="1290.0">read before</tspan><tspan x="809.0" y="1329.7">the echo</tspan><tspan x="809.0" y="1369.4">returns. Make</tspan><tspan x="809.0" y="1409.1">it useful, not</tspan><tspan x="809.0" y="1448.8">beautiful.</tspan></text><g transform="translate(532.5 937.0) rotate(8)"><text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="68" font-style="italic" font-weight="900" fill="#ff7a3d" stroke="#14171c" stroke-width="11" paint-order="stroke">SHNK</text></g>
</svg>
