<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 1672" role="img" aria-label="el-ch03-s01-p018: Elian holds the injured hand closed and matches the three-note cadence with Pressure Breath.">
  <title>el-ch03-s01-p018: Elian holds the injured hand closed and matches the three-note cadence with Pressure Breath.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch03/source/p018.png" x="0" y="0" width="941" height="1672" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 304.6 398.0 L 395.2 601.9 L 333.6 400.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="37.6" y="66.9" width="319.9" height="351.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="197.6" y="126.2">The creature</tspan><tspan x="197.6" y="162.7">has three</tspan><tspan x="197.6" y="199.2">notes. My</tspan><tspan x="197.6" y="235.7">breath has</tspan><tspan x="197.6" y="272.2">three phases.</tspan><tspan x="197.6" y="308.6">I do not need</tspan><tspan x="197.6" y="345.1">to outrun the</tspan><tspan x="197.6" y="381.6">pattern.</tspan></text><path d="M 606.4 1377.7 L 545.8 1103.5 L 635.4 1375.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="583.4" y="1357.7" width="319.9" height="247.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="743.4" y="1419.9">You need to</tspan><tspan x="743.4" y="1456.4">survive long</tspan><tspan x="743.4" y="1492.9">enough to</tspan><tspan x="743.4" y="1529.4">answer on the</tspan><tspan x="743.4" y="1565.8">third.</tspan></text>
