<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 863 1823" role="img" aria-label="el-ch03-s01-p023: The Rare Glass Lens and two Verdigris Acid Glands appear beside Elian&#x27;s bloodied palm wrap.">
  <title>el-ch03-s01-p023: The Rare Glass Lens and two Verdigris Acid Glands appear beside Elian&#x27;s bloodied palm wrap.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch03/source/p023.png" x="0" y="0" width="863" height="1823" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 274.9 492.3 L 362.5 656.3 L 303.9 494.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.5" y="72.9" width="293.4" height="439.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.2" y="135.8">Rare Glass</tspan><tspan x="181.2" y="169.3">Lens, two</tspan><tspan x="181.2" y="202.8">acid glands,</tspan><tspan x="181.2" y="236.2">one ruined</tspan><tspan x="181.2" y="269.7">glove. The</tspan><tspan x="181.2" y="303.1">dungeon</tspan><tspan x="181.2" y="336.6">remains a</tspan><tspan x="181.2" y="370.0">terrible</tspan><tspan x="181.2" y="403.5">employer with</tspan><tspan x="181.2" y="437.0">excellent</tspan><tspan x="181.2" y="470.4">inventory.</tspan></text><path d="M 558.1 1387.2 L 500.5 1203.2 L 587.1 1385.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.1" y="1367.2" width="293.4" height="382.8" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="681.8" y="1418.6">Keep the</tspan><tspan x="681.8" y="1452.1">lens. If the</tspan><tspan x="681.8" y="1485.6">next fault</tspan><tspan x="681.8" y="1519.0">moves, I</tspan><tspan x="681.8" y="1552.5">would like</tspan><tspan x="681.8" y="1585.9">better</tspan><tspan x="681.8" y="1619.4">evidence</tspan><tspan x="681.8" y="1652.8">before I</tspan><tspan x="681.8" y="1686.3">embarrass</tspan><tspan x="681.8" y="1719.8">myself again.</tspan></text>
</svg>
