<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch04-s01-p003: Sable offers Elian a race to the seal and treats the public lift as acceptable collateral.">
  <title>el-ch04-s01-p003: Sable offers Elian a race to the seal and treats the public lift as acceptable collateral.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch04/source/p003.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 558.7 491.7 L 501.1 655.6 L 587.7 493.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="72.8" width="293.8" height="438.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="135.3">The seal</tspan><tspan x="682.6" y="168.8">admits one</tspan><tspan x="682.6" y="202.3">path. Ash</tspan><tspan x="682.6" y="235.8">Crown paid</tspan><tspan x="682.6" y="269.3">for the</tspan><tspan x="682.6" y="302.8">route, so we</tspan><tspan x="682.6" y="336.3">will take the</tspan><tspan x="682.6" y="369.8">reward and</tspan><tspan x="682.6" y="403.3">leave you the</tspan><tspan x="682.6" y="436.8">educational</tspan><tspan x="682.6" y="470.3">debris.</tspan></text><path d="M 275.3 1442.2 L 362.9 1201.9 L 304.3 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="1495.2">You did not</tspan><tspan x="181.4" y="1528.7">pay for the</tspan><tspan x="181.4" y="1562.2">route. You</tspan><tspan x="181.4" y="1595.7">paid someone</tspan><tspan x="181.4" y="1629.2">to break</tspan><tspan x="181.4" y="1662.7">every public</tspan><tspan x="181.4" y="1696.2">alternative.</tspan></text>
</svg>
