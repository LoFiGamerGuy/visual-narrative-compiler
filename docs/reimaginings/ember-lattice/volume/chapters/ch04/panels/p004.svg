  <path d="M 274.9 435.8 L 362.5 656.3 L 303.9 437.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.5" y="72.9" width="293.4" height="382.8" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.2" y="157.8">One winner,</tspan><tspan x="181.2" y="191.2">no shared</tspan><tspan x="181.2" y="224.7">credit. You</tspan><tspan x="181.2" y="258.1">designed a</tspan><tspan x="181.2" y="291.6">quest that</tspan><tspan x="181.2" y="325.1">turns rescue</tspan><tspan x="181.2" y="358.5">teams into</tspan><tspan x="181.2" y="392.0">opponents.</tspan></text><path d="M 558.1 1387.2 L 500.5 1203.2 L 587.1 1385.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.1" y="1367.2" width="293.4" height="382.8" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="681.8" y="1435.4">No. I</tspan><tspan x="681.8" y="1468.8">accepted the</tspan><tspan x="681.8" y="1502.3">quest that</tspan><tspan x="681.8" y="1535.7">was already</tspan><tspan x="681.8" y="1569.2">here. Moral</tspan><tspan x="681.8" y="1602.7">editing does</tspan><tspan x="681.8" y="1636.1">not improve</tspan><tspan x="681.8" y="1669.6">completion</tspan><tspan x="681.8" y="1703.0">rates.</tspan></text><path d="M 509.9 72.9 H 828.5 V 394.0 L 810.5 412.0 H 491.9 V 90.9 Z" fill="#10151a" fill-opacity=".82" stroke="#c89952" stroke-width="3"/><path d="M 509.9 86.9 H 810.5" stroke="#f4eee4" stroke-opacity=".28" stroke-width="2"/><text font-family="Arial, sans-serif" letter-spacing=".7"><tspan x="513.9" y="120.5" font-size="30.8" font-weight="900" fill="#c89952">CLAIM VERDIGRIS</tspan><tspan x="513.9" y="152.7" font-size="30.8"