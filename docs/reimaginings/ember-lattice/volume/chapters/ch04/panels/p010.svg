<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch04-s01-p010: Wide geography shows Sable above, Elian&#x27;s party below, the seal beyond, and the Bailiff controlling the center.">
  <title>el-ch04-s01-p010: Wide geography shows Sable above, Elian&#x27;s party below, the seal beyond, and the Bailiff controlling the center.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch04/source/p010.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 318.5 435.2 L 362.9 655.6 L 347.5 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><path d="M 56.6 72.8 H 357.5 Q 371.5 72.8 371.5 86.8 V 433.2 L 349.5 455.2 H 48.6 Q 34.6 455.2 34.6 441.2 V 94.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="203.0" y="140.6">Bailiff controls</tspan><tspan x="203.0" y="174.1">center. Seal</tspan><tspan x="203.0" y="207.6">beyond. Sable</tspan><tspan x="203.0" y="241.1">above. If we</tspan><tspan x="203.0" y="274.6">force left, Mira</tspan><tspan x="203.0" y="308.1">gets one</tspan><tspan x="203.0" y="341.6">anchored thrust</tspan><tspan x="203.0" y="375.1">before the</tspan><tspan x="203.0" y="408.6">platform turns.</tspan></text><path d="M 558.7 1498.7 L 501.1 1201.9 L 587.7 1496.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1478.7" width="293.8" height="269.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1573.7">One is enough</tspan><tspan x="682.6" y="1607.2">if your mark</tspan><tspan x="682.6" y="1640.7">remains where</tspan><tspan x="682.6" y="1674.2">you put it.</tspan></text>
