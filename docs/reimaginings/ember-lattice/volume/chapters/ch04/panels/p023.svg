<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 1846" role="img" aria-label="el-ch04-s01-p023: Mira carries Elian through the kiln refuge door while Orin drags the bent spear behind them.">
  <title>el-ch04-s01-p023: Mira carries Elian through the kiln refuge door while Orin drags the bent spear behind them.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch04/source/p023.png" x="0" y="0" width="852" height="1846" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 34.1 73.8 H 371.9 L 391.9 93.8 V 296.0 H 34.1 Z" fill="#11151a" fill-opacity=".76" stroke="#e8ddc8" stroke-opacity=".35" stroke-width="2"/><text font-family="Arial, sans-serif" font-size="30.6" font-weight="700" fill="#f7f0e4"><tspan x="54.1" y="113.4">The wrong victory</tspan><tspan x="54.1" y="146.4">was still a</tspan><tspan x="54.1" y="179.4">victory. That was</tspan><tspan x="54.1" y="212.5">the part of</tspan><tspan x="54.1" y="245.5">Sable&#x27;s answer I</tspan><tspan x="54.1" y="278.5">could not dismiss.</tspan></text><text text-anchor="middle" font-family="Arial, sans-serif" font-size="30.6" font-weight="800" fill="#f8f2e8" stroke="#11151a" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="673.1" y="1440.1">Kiln door</tspan><tspan x="673.1" y="1473.1">ahead. We</tspan><tspan x="673.1" y="1506.2">lost the</tspan><tspan x="673.1" y="1539.2">seal, not the</tspan><tspan x="673.1" y="1572.2">volume.</tspan><tspan x="673.1" y="1605.2">Breathe until</tspan><tspan x="673.1" y="1638.3">that</tspan><tspan x="673.1" y="1671.3">distinction</tspan><tspan x="673.1" y="1704.3">becomes</tspan><tspan x="673.1" y="1737.4">useful.</tspan></text>
</svg>
