<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 863 1822" role="img" aria-label="el-ch05-s01-p003: Orin explains that the only Stitchfire Ampoule can heal the fracture or remain for a deeper-floor emergency.">
  <title>el-ch05-s01-p003: Orin explains that the only Stitchfire Ampoule can heal the fracture or remain for a deeper-floor emergency.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch05/source/p003.png" x="0" y="0" width="863" height="1822" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 558.1 499.3 L 500.5 655.9 L 587.1 501.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.1" y="72.9" width="293.4" height="446.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="681.8" y="122.6">The ampoule</tspan><tspan x="681.8" y="156.0">repairs the</tspan><tspan x="681.8" y="189.5">fracture. The</tspan><tspan x="681.8" y="223.0">scar stays,</tspan><tspan x="681.8" y="256.4">your strength</tspan><tspan x="681.8" y="289.9">returns</tspan><tspan x="681.8" y="323.3">slowly, and</tspan><tspan x="681.8" y="356.8">we enter the</tspan><tspan x="681.8" y="390.3">next floor</tspan><tspan x="681.8" y="423.7">without</tspan><tspan x="681.8" y="457.2">reserve</tspan><tspan x="681.8" y="490.6">medicine.</tspan></text><path d="M 274.9 1443.0 L 362.5 1202.5 L 303.9 1441.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.5" y="1423.0" width="293.4" height="326.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.2" y="1479.5">If we save</tspan><tspan x="181.2" y="1512.9">it, I cannot</tspan><tspan x="181.2" y="1546.4">hold a</tspan><tspan x="181.2" y="1579.9">weapon. If we</tspan><tspan x="181.2" y="1613.3">use it, you</tspan><tspan x="181.2" y="1646.8">cannot repair</tspan><tspan x="181.2" y="1680.2">the next</tspan><tspan x="181.2" y="1713.7">person.</tspan></text>
</svg>
