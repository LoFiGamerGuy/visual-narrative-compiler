<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 1672" role="img" aria-label="el-ch05-s01-p005: Mira makes Elian choose aloud which future risk they will accept rather than letting him spend everything silently.">
  <title>el-ch05-s01-p005: Mira makes Elian choose aloud which future risk they will accept rather than letting him spend everything silently.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch05/source/p005.png" x="0" y="0" width="941" height="1672" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 304.6 449.8 L 395.2 601.9 L 333.6 451.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="37.6" y="66.9" width="319.9" height="403.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="197.6" y="115.7">Say which risk</tspan><tspan x="197.6" y="152.2">you choose. Do</tspan><tspan x="197.6" y="188.6">not hide a</tspan><tspan x="197.6" y="225.1">sacrifice</tspan><tspan x="197.6" y="261.6">inside the</tspan><tspan x="197.6" y="298.1">word</tspan><tspan x="197.6" y="334.6">&#x27;efficient&#x27;</tspan><tspan x="197.6" y="371.0">and expect us</tspan><tspan x="197.6" y="407.5">to thank the</tspan><tspan x="197.6" y="444.0">arithmetic.</tspan></text><path d="M 606.4 1274.0 L 545.8 1103.5 L 635.4 1272.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="583.4" y="1254.0" width="319.9" height="351.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="743.4" y="1313.4">We repair the</tspan><tspan x="743.4" y="1349.8">shoulder. Then</tspan><tspan x="743.4" y="1386.3">we spend rare</tspan><tspan x="743.4" y="1422.8">parts on the</tspan><tspan x="743.4" y="1459.3">party, not on</tspan><tspan x="743.4" y="1495.8">a future sale</tspan><tspan x="743.4" y="1532.2">none of us may</tspan><tspan x="743.4" y="1568.7">reach.</tspan></text>
</svg>
