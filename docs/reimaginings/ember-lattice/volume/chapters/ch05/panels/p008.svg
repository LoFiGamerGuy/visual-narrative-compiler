<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch05-s01-p008: Orin lays out two build paths: preserve rare parts for sale or commit them to damaged fighting gear.">
  <title>el-ch05-s01-p008: Orin lays out two build paths: preserve rare parts for sale or commit them to damaged fighting gear.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch05/source/p008.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 558.7 491.7 L 501.1 655.6 L 587.7 493.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="72.8" width="293.8" height="438.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="118.6">The cracked</tspan><tspan x="682.6" y="152.1">lens can</tspan><tspan x="682.6" y="185.6">become a</tspan><tspan x="682.6" y="219.1">sight groove.</tspan><tspan x="682.6" y="252.6">The acid</tspan><tspan x="682.6" y="286.1">glands can</tspan><tspan x="682.6" y="319.6">become</tspan><tspan x="682.6" y="353.1">filters. The</tspan><tspan x="682.6" y="386.6">last seal can</tspan><tspan x="682.6" y="420.1">straighten</tspan><tspan x="682.6" y="453.6">Mira&#x27;s load</tspan><tspan x="682.6" y="487.0">path.</tspan></text><path d="M 275.3 1498.7 L 362.9 1201.9 L 304.3 1496.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="1478.7" width="293.8" height="269.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="1557.0">And every</tspan><tspan x="181.4" y="1590.5">choice</tspan><tspan x="181.4" y="1624.0">destroys the</tspan><tspan x="181.4" y="1657.4">option we did</tspan><tspan x="181.4" y="1690.9">not take.</tspan></text>
</svg>
