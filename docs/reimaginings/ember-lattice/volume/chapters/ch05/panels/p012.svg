<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch05-s01-p012: Mira sets her bent spear beside the last Iron Seal and asks Elian not to call her weapon expendable either.">
  <title>el-ch05-s01-p012: Mira sets her bent spear beside the last Iron Seal and asks Elian not to call her weapon expendable either.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch05/source/p012.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 378.8 L 362.9 655.6 L 304.3 380.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="162.6">My spear is</tspan><tspan x="181.4" y="196.1">not worth</tspan><tspan x="181.4" y="229.6">your last</tspan><tspan x="181.4" y="263.1">seal if the</tspan><tspan x="181.4" y="296.6">seal keeps us</tspan><tspan x="181.4" y="330.1">alive later.</tspan></text><path d="M 558.7 1385.8 L 501.1 1201.9 L 587.7 1383.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1365.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1433.5">Your spear</tspan><tspan x="682.6" y="1467.0">keeps us</tspan><tspan x="682.6" y="1500.5">alive now.</tspan><tspan x="682.6" y="1534.0">The seal does</tspan><tspan x="682.6" y="1567.5">not get</tspan><tspan x="682.6" y="1601.0">sentimental</tspan><tspan x="682.6" y="1634.5">priority</tspan><tspan x="682.6" y="1668.0">because it is</tspan><tspan x="682.6" y="1701.5">still unused.</tspan></text>
</svg>
