<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 1672" role="img" aria-label="el-ch05-s01-p018: Mira tells Elian that shared timing is a strategy, while solitary sacrifice is only a habit.">
  <title>el-ch05-s01-p018: Mira tells Elian that shared timing is a strategy, while solitary sacrifice is only a habit.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch05/source/p018.png" x="0" y="0" width="941" height="1672" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 304.6 449.8 L 395.2 601.9 L 333.6 451.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="37.6" y="66.9" width="319.9" height="403.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="197.6" y="115.7">Shared timing</tspan><tspan x="197.6" y="152.2">is a strategy.</tspan><tspan x="197.6" y="188.6">Spending</tspan><tspan x="197.6" y="225.1">yourself</tspan><tspan x="197.6" y="261.6">before anyone</tspan><tspan x="197.6" y="298.1">can object is</tspan><tspan x="197.6" y="334.6">a habit. I</tspan><tspan x="197.6" y="371.0">need you to</tspan><tspan x="197.6" y="407.5">know the</tspan><tspan x="197.6" y="444.0">difference.</tspan></text><path d="M 606.4 1262.8 L 545.8 1103.5 L 635.4 1260.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="583.4" y="1242.8" width="319.9" height="362.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="743.4" y="1289.5">Then object</tspan><tspan x="743.4" y="1326.0">sooner. I am</tspan><tspan x="743.4" y="1362.5">apparently</tspan><tspan x="743.4" y="1399.0">building a</tspan><tspan x="743.4" y="1435.4">class around</tspan><tspan x="743.4" y="1471.9">information</tspan><tspan x="743.4" y="1508.4">delivered</tspan><tspan x="743.4" y="1544.9">under hostile</tspan><tspan x="743.4" y="1581.4">conditions.</tspan></text>
</svg>
