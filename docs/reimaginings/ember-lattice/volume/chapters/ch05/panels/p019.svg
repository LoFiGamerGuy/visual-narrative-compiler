  <path d="M 558.7 435.2 L 501.1 655.6 L 587.7 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="140.6">Three</tspan><tspan x="682.6" y="174.1">filters. Each</tspan><tspan x="682.6" y="207.6">survives one</tspan><tspan x="682.6" y="241.1">concentrated</tspan><tspan x="682.6" y="274.6">exposure. Two</tspan><tspan x="682.6" y="308.1">for the Sump,</tspan><tspan x="682.6" y="341.6">one for the</tspan><tspan x="682.6" y="375.1">mistake we</tspan><tspan x="682.6" y="408.6">have not met.</tspan></text>
