  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch05/source/p023.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 491.7 L 362.9 655.6 L 304.3 493.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="438.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="118.6">Three roles,</tspan><tspan x="181.4" y="152.1">two repaired</tspan><tspan x="181.4" y="185.6">weapons, one</tspan><tspan x="181.4" y="219.1">medic without</tspan><tspan x="181.4" y="252.6">reserve</tspan><tspan x="181.4" y="286.1">medicine. We</tspan><tspan x="181.4" y="319.6">move only</tspan><tspan x="181.4" y="353.1">while all</tspan><tspan x="181.4" y="386.6">three can</tspan><tspan x="181.4" y="420.1">name the</tspan><tspan x="181.4" y="453.6">retreat</tspan><tspan x="181.4" y="487.0">signal.</tspan></text><path d="M 558.7 1442.2 L 501.1 1201.9 L 587.7 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1495.2">The retreat</tspan><tspan x="682.6" y="1528.7">signal is</tspan><tspan x="682.6" y="1562.2">&#x27;Orin was</tspan><tspan x="682.6" y="1595.7">right.&#x27; I</tspan><tspan x="682.6" y="1629.2">expect crisp</tspan><tspan x="682.6" y="1662.7">diction under</tspan><tspan x="682.6" y="1696.2">pressure.</tspan></text>
</svg>
