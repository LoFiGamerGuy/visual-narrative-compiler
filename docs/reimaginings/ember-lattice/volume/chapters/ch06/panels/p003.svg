<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 857 1836" role="img" aria-label="el-ch06-s01-p003: Elian and Mira fit two Verdigris Filters while Orin seals his kiln satchel.">
  <title>el-ch06-s01-p003: Elian and Mira fit two Verdigris Filters while Orin seals his kiln satchel.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch06/source/p003.png" x="0" y="0" width="857" height="1836" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 554.3 495.9 L 497.1 661.0 L 583.3 497.9 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="531.3" y="73.4" width="291.4" height="442.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="30.8" font-weight="700" fill="#15181d"><tspan x="677.0" y="139.0">Filters seat</tspan><tspan x="677.0" y="172.2">under the</tspan><tspan x="677.0" y="205.5">collar. If</tspan><tspan x="677.0" y="238.7">the ceramic</tspan><tspan x="677.0" y="271.9">turns black,</tspan><tspan x="677.0" y="305.1">leave the</tspan><tspan x="677.0" y="338.4">water even if</tspan><tspan x="677.0" y="371.6">the Ledger</tspan><tspan x="677.0" y="404.8">calls the</tspan><tspan x="677.0" y="438.0">objective</tspan><tspan x="677.0" y="471.3">recoverable.</tspan></text><path d="M 272.7 1567.7 L 359.9 1211.8 L 301.7 1565.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.3" y="1547.7" width="291.4" height="214.8" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="30.8" font-weight="700" fill="#15181d"><tspan x="180.0" y="1649.0">And if the</tspan><tspan x="180.0" y="1682.2">heart fails?</tspan></text>
</svg>
