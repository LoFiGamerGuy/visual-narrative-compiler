<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch06-s01-p004: The three adults agree on a retreat signal and which pump column must remain intact.">
  <title>el-ch06-s01-p004: The three adults agree on a retreat signal and which pump column must remain intact.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch06/source/p004.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 435.2 L 362.9 655.6 L 304.3 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="123.9">We retreat on</tspan><tspan x="181.4" y="157.4">two shield</tspan><tspan x="181.4" y="190.8">strikes. The</tspan><tspan x="181.4" y="224.3">west column</tspan><tspan x="181.4" y="257.8">stays</tspan><tspan x="181.4" y="291.3">standing.</tspan><tspan x="181.4" y="324.8">Nobody</tspan><tspan x="181.4" y="358.3">crosses an</tspan><tspan x="181.4" y="391.8">acid lane</tspan><tspan x="181.4" y="425.3">alone.</tspan></text><path d="M 558.7 1442.2 L 501.1 1201.9 L 587.7 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1495.2">A complete</tspan><tspan x="682.6" y="1528.7">plan with</tspan><tspan x="682.6" y="1562.2">verbs and</tspan><tspan x="682.6" y="1595.7">limits. The</tspan><tspan x="682.6" y="1629.2">class may yet</tspan><tspan x="682.6" y="1662.7">become</tspan><tspan x="682.6" y="1696.2">employable.</tspan></text>
</svg>
