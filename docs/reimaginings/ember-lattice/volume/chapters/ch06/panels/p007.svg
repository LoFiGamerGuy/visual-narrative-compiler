<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="el-ch06-s01-p007: Side-on geography fixes the pump heart center, party left, Choir right, and two incoming water lanes.">
  <title>el-ch06-s01-p007: Side-on geography fixes the pump heart center, party left, Choir right, and two incoming water lanes.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch06/source/p007.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 336.1 393.0 L 430.1 553.0 L 365.1 395.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="41.0" y="61.4" width="348.2" height="351.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="215.0" y="110.8">Heart center.</tspan><tspan x="215.0" y="150.5">Two lanes</tspan><tspan x="215.0" y="190.2">incoming. Orin</tspan><tspan x="215.0" y="229.9">behind my left</tspan><tspan x="215.0" y="269.6">edge; Elian</tspan><tspan x="215.0" y="309.3">owns the</tspan><tspan x="215.0" y="349.0">oxidized</tspan><tspan x="215.0" y="388.7">column.</tspan></text><path d="M 657.9 1143.0 L 593.9 1013.8 L 686.9 1141.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="634.9" y="1123.0" width="348.2" height="351.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="809.0" y="1172.3">If the column</tspan><tspan x="809.0" y="1212.0">moves, the</tspan><tspan x="809.0" y="1251.7">whole room</tspan><tspan x="809.0" y="1291.4">changes</tspan><tspan x="809.0" y="1331.1">direction. I</tspan><tspan x="809.0" y="1370.8">will ask</tspan><tspan x="809.0" y="1410.5">before</tspan><tspan x="809.0" y="1450.2">improving it.</tspan></text>
</svg>
