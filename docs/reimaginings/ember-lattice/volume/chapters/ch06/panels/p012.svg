<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 887 1774" role="img" aria-label="el-ch06-s01-p012: The second Choir breaks the lower sluice, flooding the space between Mira and Elian.">
  <title>el-ch06-s01-p012: The second Choir breaks the lower sluice, flooding the space between Mira and Elian.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch06/source/p012.png" x="0" y="0" width="887" height="1774" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 572.9 313.5 L 514.5 638.6 L 601.9 315.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="549.9" y="71.0" width="301.6" height="262.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.8" font-weight="700" fill="#15181d"><tspan x="700.7" y="144.3">Lower sluice</tspan><tspan x="700.7" y="178.7">broken. Water</tspan><tspan x="700.7" y="213.1">divides us in</tspan><tspan x="700.7" y="247.5">three</tspan><tspan x="700.7" y="281.8">seconds.</tspan></text><path d="M 284.1 1460.5 L 372.5 1170.8 L 313.1 1458.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="35.5" y="1440.5" width="301.6" height="262.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.8" font-weight="700" fill="#15181d"><tspan x="186.3" y="1513.8">Then I cross</tspan><tspan x="186.3" y="1548.2">in two and</tspan><tspan x="186.3" y="1582.6">leave the</tspan><tspan x="186.3" y="1617.0">third for</tspan><tspan x="186.3" y="1651.4">being wrong.</tspan></text><g transform="translate(461.2 1082.1) rotate(8)"><text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="68" font-style="italic" font-weight="900" fill="#ff7a3d" stroke="#14171c" stroke-width="11" paint-order="stroke">KLANG</text></g>
</svg>
