<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 863 1823" role="img" aria-label="el-ch07-s01-p003: Orin checks his kiln satchel straps while warning that the ceiling fault is moving against the water load.">
  <title>el-ch07-s01-p003: Orin checks his kiln satchel straps while warning that the ceiling fault is moving against the water load.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch07/source/p003.png" x="0" y="0" width="863" height="1823" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 558.1 492.3 L 500.5 656.3 L 587.1 494.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.1" y="72.9" width="293.4" height="439.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="681.8" y="152.6">Ceiling fault</tspan><tspan x="681.8" y="186.0">is migrating</tspan><tspan x="681.8" y="219.5">with water</tspan><tspan x="681.8" y="252.9">load. If it</tspan><tspan x="681.8" y="286.4">reaches the</tspan><tspan x="681.8" y="319.9">pale arch,</tspan><tspan x="681.8" y="353.3">the heart</tspan><tspan x="681.8" y="386.8">drowns under</tspan><tspan x="681.8" y="420.2">its own</tspan><tspan x="681.8" y="453.7">housing.</tspan></text><path d="M 274.9 1500.3 L 362.5 1203.2 L 303.9 1498.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.5" y="1480.3" width="293.4" height="269.8" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.2" y="1542.1">Keep the</tspan><tspan x="181.2" y="1575.5">satchel</tspan><tspan x="181.2" y="1609.0">closed and</tspan><tspan x="181.2" y="1642.4">your route</tspan><tspan x="181.2" y="1675.9">shorter than</tspan><tspan x="181.2" y="1709.4">mine.</tspan></text>
</svg>
