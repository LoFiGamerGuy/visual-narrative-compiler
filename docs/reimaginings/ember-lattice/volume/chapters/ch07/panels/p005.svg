<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch07-s01-p005: Wide geography fixes the Hound above the secondary sluice, Mira below, Orin near the heart line, and Elian opposite.">
  <title>el-ch07-s01-p005: Wide geography fixes the Hound above the secondary sluice, Mira below, Orin near the heart line, and Elian opposite.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch07/source/p005.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 435.2 L 362.9 655.6 L 304.3 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="140.6">Hound above</tspan><tspan x="181.4" y="174.1">the sluice.</tspan><tspan x="181.4" y="207.6">Heart through</tspan><tspan x="181.4" y="241.1">the far arch.</tspan><tspan x="181.4" y="274.6">Orin stays</tspan><tspan x="181.4" y="308.1">below my</tspan><tspan x="181.4" y="341.6">shield; you</tspan><tspan x="181.4" y="375.1">watch the</tspan><tspan x="181.4" y="408.6">bite pattern.</tspan></text><path d="M 558.7 1442.2 L 501.1 1201.9 L 587.7 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1512.0">I watch the</tspan><tspan x="682.6" y="1545.5">whole</tspan><tspan x="682.6" y="1579.0">pattern. No</tspan><tspan x="682.6" y="1612.5">early draw,</tspan><tspan x="682.6" y="1646.0">even when the</tspan><tspan x="682.6" y="1679.5">jaw offers one.</tspan></text>
</svg>
