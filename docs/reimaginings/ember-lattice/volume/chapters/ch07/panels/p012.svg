<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 863 1822" role="img" aria-label="el-ch07-s01-p012: Elian abandons the killing angle and Fault Steps to the seam that can divert the plate from Mira.">
  <title>el-ch07-s01-p012: Elian abandons the killing angle and Fault Steps to the seam that can divert the plate from Mira.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch07/source/p012.png" x="0" y="0" width="863" height="1822" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 274.9 435.5 L 362.5 655.9 L 303.9 437.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.5" y="72.9" width="293.4" height="382.6" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.2" y="140.9">Killing angle</tspan><tspan x="181.2" y="174.3">is open. So</tspan><tspan x="181.2" y="207.8">is the line</tspan><tspan x="181.2" y="241.3">that takes</tspan><tspan x="181.2" y="274.7">the plate</tspan><tspan x="181.2" y="308.2">away from</tspan><tspan x="181.2" y="341.6">Mira. I</tspan><tspan x="181.2" y="375.1">cannot choose</tspan><tspan x="181.2" y="408.6">both.</tspan></text><path d="M 558.1 1499.5 L 500.5 1202.5 L 587.1 1497.5 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.1" y="1479.5" width="293.4" height="269.7" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="681.8" y="1557.9">You can.</tspan><tspan x="681.8" y="1591.4">Choose the</tspan><tspan x="681.8" y="1624.8">person first</tspan><tspan x="681.8" y="1658.3">and let the</tspan><tspan x="681.8" y="1691.7">class catch up.</tspan></text><g transform="translate(448.8 1111.4) rotate(8)"><text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="68" font-style="italic" font-weight="900" fill="#ff7a3d" stroke="#14171c" stroke-width="11" paint-order="stroke">SHNK</text></g>
</svg>
