<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch07-s01-p023: Mira tells Elian the class changed because his decision changed first; Orin mourns the lost satchel without melodrama.">
  <title>el-ch07-s01-p023: Mira tells Elian the class changed because his decision changed first; Orin mourns the lost satchel without melodrama.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch07/source/p023.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 435.2 L 362.9 655.6 L 304.3 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="140.6">Your class</tspan><tspan x="181.4" y="174.1">changed after</tspan><tspan x="181.4" y="207.6">your choice</tspan><tspan x="181.4" y="241.1">did. Remember</tspan><tspan x="181.4" y="274.6">the order</tspan><tspan x="181.4" y="308.1">when power</tspan><tspan x="181.4" y="341.6">tries to</tspan><tspan x="181.4" y="375.1">rewrite the</tspan><tspan x="181.4" y="408.6">story.</tspan></text><path d="M 558.7 1385.8 L 501.1 1201.9 L 587.7 1383.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1365.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1416.8">I will. And</tspan><tspan x="682.6" y="1450.3">we will</tspan><tspan x="682.6" y="1483.8">rebuild your</tspan><tspan x="682.6" y="1517.3">satchel</tspan><tspan x="682.6" y="1550.8">before you</tspan><tspan x="682.6" y="1584.2">start</tspan><tspan x="682.6" y="1617.7">treating</tspan><tspan x="682.6" y="1651.2">injuries with</tspan><tspan x="682.6" y="1684.7">disapproval</tspan><tspan x="682.6" y="1718.2">alone.</tspan></text>
</svg>
