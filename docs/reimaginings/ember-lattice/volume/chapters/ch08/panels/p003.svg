<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch08-s01-p003: Elian confronts Sable about the shortcut while Mira keeps the damaged Survey Bracer in view.">
  <title>el-ch08-s01-p003: Elian confronts Sable about the shortcut while Mira keeps the damaged Survey Bracer in view.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch08/source/p003.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 558.7 435.2 L 501.1 655.6 L 587.7 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="140.6">Long enough</tspan><tspan x="682.6" y="174.1">to reach the</tspan><tspan x="682.6" y="207.6">crown. Not</tspan><tspan x="682.6" y="241.1">long enough</tspan><tspan x="682.6" y="274.6">to pretend</tspan><tspan x="682.6" y="308.1">Ash Crown</tspan><tspan x="682.6" y="341.6">will forgive</tspan><tspan x="682.6" y="375.1">a failed</tspan><tspan x="682.6" y="408.6">delivery.</tspan></text><path d="M 275.3 1442.2 L 362.9 1201.9 L 304.3 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="1512.0">The shortcut</tspan><tspan x="181.4" y="1545.5">fed teams to</tspan><tspan x="181.4" y="1579.0">the Bailiff,</tspan><tspan x="181.4" y="1612.5">and you still</tspan><tspan x="181.4" y="1646.0">delivered the</tspan><tspan x="181.4" y="1679.5">seal.</tspan></text>
</svg>
