  <path d="M 275.3 435.2 L 362.9 655.6 L 304.3 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="140.6">Sable</tspan><tspan x="181.4" y="174.1">opposite us.</tspan><tspan x="181.4" y="207.6">Exit above.</tspan><tspan x="181.4" y="241.1">Maw center. I</tspan><tspan x="181.4" y="274.6">can bridge</tspan><tspan x="181.4" y="308.1">one ring if</tspan><tspan x="181.4" y="341.6">she stops</tspan><tspan x="181.4" y="375.1">spending debt</tspan><tspan x="181.4" y="408.6">like stamina.</tspan></text><path d="M 558.7 1498.7 L 501.1 1201.9 L 587.7 1496.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1478.7" width="293.8" height="269.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1557.0">Debt is the</tspan><tspan x="682.6" y="1590.5">only stat Ash</tspan><tspan x="682.6" y="1624.0">Crown lets us</tspan><tspan x="682.6" y="1657.4">carry past</tspan><tspan x="682.6" y="1690.9">failure.</tspan></text><g transform="translate(449.3 1110.8) rotate(8)"><text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="68" font-style="italic" font-weight="900" fill="#ff7a3d" stroke="#14171c" stroke-width="11" paint-order="stroke">KRAK</text></g>
