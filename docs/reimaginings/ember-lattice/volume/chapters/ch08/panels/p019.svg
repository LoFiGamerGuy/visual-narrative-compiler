  <path d="M 558.7 265.9 L 501.1 655.6 L 587.7 267.9 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="72.8" width="293.8" height="213.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="139.7">You trust me</tspan><tspan x="682.6" y="173.2">on the ring</tspan><tspan x="682.6" y="206.7">after the</tspan><tspan x="682.6" y="240.2">gate?</tspan></text><path d="M 275.3 1442.2 L 362.9 1201.9 L 304.3 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="1512.0">No. I trust</tspan><tspan x="181.4" y="1545.5">the decision</tspan><tspan x="181.4" y="1579.0">you are</tspan><tspan x="181.4" y="1612.5">making while</tspan><tspan x="181.4" y="1646.0">it costs you</tspan><tspan x="181.4" y="1679.5">something.</tspan></text>
