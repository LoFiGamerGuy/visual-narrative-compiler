<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="el-ch09-s01-p004: Orin proposes a single irreversible forge: one weapon strong enough for the Regent or several parts safe enough to sell.">
  <title>el-ch09-s01-p004: Orin proposes a single irreversible forge: one weapon strong enough for the Regent or several parts safe enough to sell.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch09/source/p004.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 606.7 472.4 L 593.9 553.0 L 635.7 474.4 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><path d="M 605.7 61.4 H 969.0 Q 983.0 61.4 983.0 75.4 V 470.4 L 961.0 492.4 H 597.7 Q 583.7 492.4 583.7 478.4 V 83.4 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="783.4" y="110.8">The forge</tspan><tspan x="783.4" y="150.5">consumes</tspan><tspan x="783.4" y="190.2">Glasshook, Rift</tspan><tspan x="783.4" y="229.9">Nail, and Maw</tspan><tspan x="783.4" y="269.6">Core. No</tspan><tspan x="783.4" y="309.3">reversals, no</tspan><tspan x="783.4" y="349.0">spare relic, no</tspan><tspan x="783.4" y="388.7">second attempt</tspan><tspan x="783.4" y="428.4">if the channel</tspan><tspan x="783.4" y="468.1">cracks.</tspan></text><path d="M 336.1 1103.3 L 430.1 1013.8 L 365.1 1101.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="41.0" y="1083.3" width="348.2" height="391.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="215.0" y="1132.6">Build the</tspan><tspan x="215.0" y="1172.3">Regentbreaker.</tspan><tspan x="215.0" y="1212.0">A safe</tspan><tspan x="215.0" y="1251.7">collection of</tspan><tspan x="215.0" y="1291.4">parts cannot</tspan><tspan x="215.0" y="1331.1">stop the thing</tspan><tspan x="215.0" y="1370.8">those parts</tspan><tspan x="215.0" y="1410.5">taught us to</tspan><tspan x="215.0" y="1450.2">understand.</tspan></text>
