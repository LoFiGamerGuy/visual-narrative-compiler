<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch09-s01-p006: Anchorfork, Sumpglass Coil, and Tuning-Fork Key combine into Mira&#x27;s pale Crownfork Spear.">
  <title>el-ch09-s01-p006: Anchorfork, Sumpglass Coil, and Tuning-Fork Key combine into Mira&#x27;s pale Crownfork Spear.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch09/source/p006.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 491.7 L 362.9 655.6 L 304.3 493.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="438.9" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="118.6">Crownfork</tspan><tspan x="181.4" y="152.1">carries the</tspan><tspan x="181.4" y="185.6">Sumpglass</tspan><tspan x="181.4" y="219.1">rhythm</tspan><tspan x="181.4" y="252.6">through the</tspan><tspan x="181.4" y="286.1">old</tspan><tspan x="181.4" y="319.6">Anchorfork</tspan><tspan x="181.4" y="353.1">line. My</tspan><tspan x="181.4" y="386.6">injured arm</tspan><tspan x="181.4" y="420.1">may not carry</tspan><tspan x="181.4" y="453.6">the return</tspan><tspan x="181.4" y="487.0">stroke.</tspan></text><path d="M 558.7 1432.7 L 501.1 1201.9 L 587.7 1430.7 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1412.7" width="293.8" height="335.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1457.0">Then Lockstep</tspan><tspan x="682.6" y="1490.5">supplies the</tspan><tspan x="682.6" y="1524.0">return.</tspan><tspan x="682.6" y="1557.5">Equipment</tspan><tspan x="682.6" y="1591.0">changes</tspan><tspan x="682.6" y="1624.5">tactics; it</tspan><tspan x="682.6" y="1658.0">does not</tspan><tspan x="682.6" y="1691.5">erase</tspan><tspan x="682.6" y="1725.0">anatomy.</tspan></text>
</svg>
