<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch09-s01-p013: Elian marks knee and cable while Sable cuts a safe movement lane between them.">
  <title>el-ch09-s01-p013: Elian marks knee and cable while Sable cuts a safe movement lane between them.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch09/source/p013.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 558.7 322.3 L 501.1 655.6 L 587.7 324.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="72.8" width="293.8" height="269.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="167.9">Lane open</tspan><tspan x="682.6" y="201.4">from knee to</tspan><tspan x="682.6" y="234.9">housing. No</tspan><tspan x="682.6" y="268.4">debt added.</tspan></text><path d="M 275.3 1555.1 L 362.9 1201.9 L 304.3 1553.1 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="1535.1" width="293.8" height="213.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="1601.9">Good. Keep</tspan><tspan x="181.4" y="1635.4">the lane; I</tspan><tspan x="181.4" y="1668.9">will turn</tspan><tspan x="181.4" y="1702.4">inside it.</tspan></text>
</svg>
