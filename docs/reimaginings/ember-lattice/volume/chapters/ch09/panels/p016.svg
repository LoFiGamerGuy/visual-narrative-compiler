<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch09-s01-p016: Sable takes Mira&#x27;s exposed side without asking for forgiveness or command.">
  <title>el-ch09-s01-p016: Sable takes Mira&#x27;s exposed side without asking for forgiveness or command.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch09/source/p016.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 558.7 1442.2 L 501.1 1201.9 L 587.7 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1495.2">Then I take</tspan><tspan x="682.6" y="1528.7">the exposed</tspan><tspan x="682.6" y="1562.2">side. Do not</tspan><tspan x="682.6" y="1595.7">mistake</tspan><tspan x="682.6" y="1629.2">useful timing</tspan><tspan x="682.6" y="1662.7">for an</tspan><tspan x="682.6" y="1696.2">apology.</tspan></text><path d="M 275.3 322.3 L 362.9 655.6 L 304.3 324.3 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="269.5" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="151.1">I will</tspan><tspan x="181.4" y="184.6">schedule</tspan><tspan x="181.4" y="218.1">forgiveness</tspan><tspan x="181.4" y="251.6">after we stop</tspan><tspan x="181.4" y="285.1">falling.</tspan></text><g transform="translate(449.3 1110.8) rotate(8)"><text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="68" font-style="italic" font-weight="900" fill="#ff7a3d" stroke="#14171c" stroke-width="11" paint-order="stroke">THOOM</text></g>
</svg>
