<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch10-s01-p001: The Bell Regent towers through the final chamber, four long legs spanning ivory platforms above the public lift cable.">
  <title>el-ch10-s01-p001: The Bell Regent towers through the final chamber, four long legs spanning ivory platforms above the public lift cable.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch10/source/p001.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 34.6 72.8 H 377.4 L 397.4 92.8 V 331.3 H 34.6 Z" fill="#11151a" fill-opacity=".76" stroke="#e8ddc8" stroke-opacity=".35" stroke-width="2"/><text font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#f7f0e4"><tspan x="54.6" y="112.8">The Regent had no</tspan><tspan x="54.6" y="146.3">throne. It had</tspan><tspan x="54.6" y="179.7">four legs, a city</tspan><tspan x="54.6" y="213.2">beneath it, and a</tspan><tspan x="54.6" y="246.7">note that made</tspan><tspan x="54.6" y="280.2">every structure</tspan><tspan x="54.6" y="313.7">kneel.</tspan></text>
