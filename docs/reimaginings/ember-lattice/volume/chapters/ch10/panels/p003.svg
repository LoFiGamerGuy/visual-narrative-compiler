<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1535" role="img" aria-label="el-ch10-s01-p003: Elian assigns Mira the yoke, Sable the escape lane, Orin the lift cable, and himself the hostile note.">
  <title>el-ch10-s01-p003: Elian assigns Mira the yoke, Sable the escape lane, Orin the lift cable, and himself the hostile note.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch10/source/p003.png" x="0" y="0" width="1024" height="1535" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 336.1 472.4 L 430.1 552.6 L 365.1 474.4 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="41.0" y="61.4" width="348.2" height="431.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="215.0" y="110.7">Mira owns the</tspan><tspan x="215.0" y="150.4">yoke. Sable</tspan><tspan x="215.0" y="190.1">owns the</tspan><tspan x="215.0" y="229.8">escape lane.</tspan><tspan x="215.0" y="269.5">Orin owns the</tspan><tspan x="215.0" y="309.2">public cable.</tspan><tspan x="215.0" y="348.9">I take the</tspan><tspan x="215.0" y="388.6">note and</tspan><tspan x="215.0" y="428.3">return a</tspan><tspan x="215.0" y="468.0">fault.</tspan></text><path d="M 657.9 1062.6 L 593.9 1013.1 L 686.9 1060.6 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="634.9" y="1042.6" width="348.2" height="431.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="36.8" font-weight="700" fill="#15181d"><tspan x="809.0" y="1092.0">You take the</tspan><tspan x="809.0" y="1131.7">note only</tspan><tspan x="809.0" y="1171.4">after it</tspan><tspan x="809.0" y="1211.1">finishes. No</tspan><tspan x="809.0" y="1250.7">early draw, no</tspan><tspan x="809.0" y="1290.4">private</tspan><tspan x="809.0" y="1330.1">sacrifice, no</tspan><tspan x="809.0" y="1369.8">improvising a</tspan><tspan x="809.0" y="1409.5">funeral into</tspan><tspan x="809.0" y="1449.2">the plan.</tspan></text>
</svg>
