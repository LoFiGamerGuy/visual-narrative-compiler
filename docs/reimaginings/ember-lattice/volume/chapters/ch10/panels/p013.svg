  <path d="M 558.7 265.9 L 501.1 655.6 L 587.7 267.9 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="72.8" width="293.8" height="213.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="156.4">I can cut</tspan><tspan x="682.6" y="189.9">toward the</tspan><tspan x="682.6" y="223.4">Regent.</tspan></text><path d="M 275.3 1442.2 L 362.9 1201.9 L 304.3 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="1495.2">Cut toward</tspan><tspan x="181.4" y="1528.7">Orin. Saving</tspan><tspan x="181.4" y="1562.2">the cable is</tspan><tspan x="181.4" y="1595.7">the fight,</tspan><tspan x="181.4" y="1629.2">even when the</tspan><tspan x="181.4" y="1662.7">boss is</tspan><tspan x="181.4" y="1696.2">louder.</tspan></text>
