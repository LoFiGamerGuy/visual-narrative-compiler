  <title>el-ch10-s01-p018: Inside the second hostile note, Elian accepts its cadence and opens Breath Channel II in two restrained ember arcs.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch10/source/p018.png" x="0" y="0" width="866" height="1817" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 34.6 72.7 H 378.4 L 398.4 92.7 V 365.3 H 34.6 Z" fill="#11151a" fill-opacity=".76" stroke="#e8ddc8" stroke-opacity=".35" stroke-width="2"/><text font-family="Arial, sans-serif" font-size="31.1" font-weight="700" fill="#f7f0e4"><tspan x="54.6" y="112.7">I had tried to</tspan><tspan x="54.6" y="146.2">defeat the bell by</tspan><tspan x="54.6" y="179.8">holding my own</tspan><tspan x="54.6" y="213.4">rhythm. Channel II</tspan><tspan x="54.6" y="247.0">opened when I</tspan><tspan x="54.6" y="280.5">accepted its</tspan><tspan x="54.6" y="314.1">cadence without</tspan><tspan x="54.6" y="347.7">surrendering mine.</tspan></text>
