<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch10-s01-p020: Fault Step II follows the bent cable to Mira, then pivots at the linked yoke fault.">
  <title>el-ch10-s01-p020: Fault Step II follows the bent cable to Mira, then pivots at the linked yoke fault.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch10/source/p020.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 318.5 378.8 L 362.9 655.6 L 347.5 380.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><path d="M 56.6 72.8 H 357.5 Q 371.5 72.8 371.5 86.8 V 376.8 L 349.5 398.8 H 48.6 Q 34.6 398.8 34.6 384.8 V 94.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="203.0" y="145.9">Fault Step</tspan><tspan x="203.0" y="179.4">follows the bent</tspan><tspan x="203.0" y="212.9">cable, pivots at</tspan><tspan x="203.0" y="246.4">the yoke. Mira,</tspan><tspan x="203.0" y="279.9">I need your</tspan><tspan x="203.0" y="313.4">anchor for the</tspan><tspan x="203.0" y="346.9">second draw.</tspan></text><path d="M 558.7 1385.8 L 501.1 1201.9 L 587.7 1383.8 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1365.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1450.3">You have it.</tspan><tspan x="682.6" y="1483.8">Sable clears</tspan><tspan x="682.6" y="1517.3">the return;</tspan><tspan x="682.6" y="1550.8">Orin locks</tspan><tspan x="682.6" y="1584.2">the city</tspan><tspan x="682.6" y="1617.7">line. Nobody</tspan><tspan x="682.6" y="1651.2">carries this</tspan><tspan x="682.6" y="1684.7">alone.</tspan></text><g transform="translate(449.3 1110.8) rotate(8)"><text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="68" font-style="italic" font-weight="900" fill="#ff7a3d" stroke="#14171c" stroke-width="11" paint-order="stroke">KLANG</text></g>
