  <path d="M 606.4 346.2 L 545.8 601.9 L 635.4 348.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="583.4" y="66.9" width="319.9" height="299.3" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="743.4" y="136.8">Escape lane</tspan><tspan x="743.4" y="173.3">closed. Attack</tspan><tspan x="743.4" y="209.8">lane open. For</tspan><tspan x="743.4" y="246.2">once, the</tspan><tspan x="743.4" y="282.7">difference is</tspan><tspan x="743.4" y="319.2">voluntary.</tspan></text><path d="M 304.6 1274.0 L 395.2 1103.5 L 333.6 1272.0 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="37.6" y="1254.0" width="319.9" height="351.1" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="33.8" font-weight="700" fill="#15181d"><tspan x="197.6" y="1313.4">Cable tension</tspan><tspan x="197.6" y="1349.8">stable. Do the</tspan><tspan x="197.6" y="1386.3">spectacular</tspan><tspan x="197.6" y="1422.8">thing before</tspan><tspan x="197.6" y="1459.3">my equipment</tspan><tspan x="197.6" y="1495.8">develops</tspan><tspan x="197.6" y="1532.2">another</tspan><tspan x="197.6" y="1568.7">opinion.</tspan></text>
