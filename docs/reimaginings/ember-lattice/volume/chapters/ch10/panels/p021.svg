<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 1672" role="img" aria-label="el-ch10-s01-p021: Mira, Sable, and Orin lock the cable and yoke so Elian&#x27;s two-stage draw has one unambiguous target.">
