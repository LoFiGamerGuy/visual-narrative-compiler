<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1821" role="img" aria-label="el-ch10-s01-p023: The Bell Regent collapses away from the public cable; Crown Shard, Meridian Seal, and Sponsor Writ resolve with boss credit.">
  <title>el-ch10-s01-p023: The Bell Regent collapses away from the public cable; Crown Shard, Meridian Seal, and Sponsor Writ resolve with boss credit.</title>
  <image href="../../../../../../../experiments/reimaginings/ember-lattice/volume/ch10/source/p023.png" x="0" y="0" width="864" height="1821" preserveAspectRatio="xMidYMid slice"/>
  <path d="M 275.3 435.2 L 362.9 655.6 L 304.3 437.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="34.6" y="72.8" width="293.8" height="382.4" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="181.4" y="140.6">Boss credit</tspan><tspan x="181.4" y="174.1">confirmed.</tspan><tspan x="181.4" y="207.6">Public cable</tspan><tspan x="181.4" y="241.1">intact. Mira,</tspan><tspan x="181.4" y="274.6">please tell</tspan><tspan x="181.4" y="308.1">me the</tspan><tspan x="181.4" y="341.6">enormous bell</tspan><tspan x="181.4" y="375.1">is finished</tspan><tspan x="181.4" y="408.6">moving.</tspan></text><path d="M 558.7 1442.2 L 501.1 1201.9 L 587.7 1440.2 Z" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4" stroke-linejoin="round"/><rect x="535.7" y="1422.2" width="293.8" height="326.0" rx="54.0" fill="#f7f0e4" fill-opacity=".84" stroke="#181b20" stroke-width="4"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#15181d"><tspan x="682.6" y="1478.5">It is. Sit</tspan><tspan x="682.6" y="1512.0">down before</tspan><tspan x="682.6" y="1545.5">the Ledger</tspan><tspan x="682.6" y="1579.0">mistakes</tspan><tspan x="682.6" y="1612.5">standing for</tspan><tspan x="682.6" y="1646.0">consent to</tspan><tspan x="682.6" y="1679.5">another</tspan><tspan x="682.6" y="1713.0">quest.</tspan></text>
</svg>
