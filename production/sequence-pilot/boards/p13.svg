<title id="title">Panel 13: original wide aftermath layout diagram</title>
<desc id="desc">Editable storyboard expectation, not final illustration or observed generated art. Camera moves east with adults while preserving west-left/east-right axis. Door is now screen center, both adults to its RIGHT. Living violet-gill sentinel remains left; foreleg pinned under bottom edge. Free cord falls slack on east floor.</desc>
